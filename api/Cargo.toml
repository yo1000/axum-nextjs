[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
axum-valid = "0.24.0"
chrono = { version = "0.4.44", features = ["serde"] }
config = { version = "0.15.22", features = ["toml", "yaml"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1.52.2", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.10", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["v4", "v7", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
thiserror = "2.0.18"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.3", features = ["json"] }
serde_repr = "0.1.20"
